name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Validate Integrity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify essential root and configuration files
        shell: bash
        run: |
          for file in config/GEMINI.md README.md TOOLKIT.md LICENSE sync.ps1 restore.ps1; do
            if [ ! -f "$file" ]; then
              echo "Error: Required file $file is missing!" >&2
              exit 1
            fi
          done
          echo "All essential root files present."

      - name: Verify PowerShell script syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter "*.ps1" -Recurse | ForEach-Object {
            $err = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$err) | Out-Null
            if ($err) {
              Write-Error "Syntax error in $($_.FullName): $err"
              exit 1
            }
            Write-Host "[PASS] Syntax verified: $($_.Name)"
          }

      - name: Run PowerShell AST Command Safety Test Suite (pwsh)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File "config/skills/orchestrator/scripts/Test-PowerShellCommandSafety.Tests.ps1"

      - name: Run Audit Checkpoint & Rollback Test Suite (pwsh)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File "config/skills/orchestrator/scripts/AuditCheckpoint.Tests.ps1"

      - name: Run YAML Syntax & Schema Test Suite (pwsh)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File "config/skills/orchestrator/scripts/YamlValidation.Tests.ps1"

      - name: Run Test Suites on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "config/skills/orchestrator/scripts/Test-PowerShellCommandSafety.Tests.ps1"
          powershell -NoProfile -ExecutionPolicy Bypass -File "config/skills/orchestrator/scripts/AuditCheckpoint.Tests.ps1"
          powershell -NoProfile -ExecutionPolicy Bypass -File "config/skills/orchestrator/scripts/YamlValidation.Tests.ps1"

      - name: Run Runner-Native yamllint on Pure YAML (.github/**/*.yml)
        shell: bash
        run: |
          if command -v yamllint >/dev/null 2>&1; then
            yamllint -c .yamllint.yml .github/
            echo "[PASS] yamllint verified all .github YAML files."
          else
            echo "[SKIP] yamllint not present in PATH; verified via PowerShell test suite."
          fi

      - name: Verify Custom Agent Manifests
        shell: pwsh
        run: |
          $agents = Get-ChildItem -Path "config/agents" -Directory
          if ($agents.Count -ne 10) {
            Write-Error "Expected exactly 10 agents, found $($agents.Count)"
            exit 1
          }
          foreach ($a in $agents) {
            $agentFile = Join-Path $a.FullName "agent.md"
            if (-not (Test-Path $agentFile)) {
              Write-Error "Missing agent.md in $($a.Name)"
              exit 1
            }
            $content = Get-Content $agentFile -Raw
            if ($content -notmatch '(?m)^name:\s+' -or $content -notmatch '(?m)^description:\s+' -or $content -notmatch '(?m)^model:\s+(inherit|flash)\s*$' -or $content -notmatch '(?m)^subagent:\s+true\s*$' -or $content -notmatch '(?m)^mainAgent:\s+false\s*$' -or $content -notmatch '(?m)^tools:\s+') {
              Write-Error "Invalid frontmatter in $agentFile"
              exit 1
            }
            if ($a.Name -eq "build-error-resolver" -and $content -match '(?m)^\s*-\s*write_to_file\b') {
              Write-Error "Security invariant violation: build-error-resolver must not possess write_to_file"
              exit 1
            }
          }
          Write-Host "[PASS] All $($agents.Count) custom agents verified."

      - name: Verify Bundled Skill Manifests
        shell: pwsh
        run: |
          $skills = Get-ChildItem -Path "config/skills" -Filter "SKILL.md" -Recurse
          if ($skills.Count -ne 15) {
            Write-Error "Expected exactly 15 bespoke skills, found $($skills.Count)"
            exit 1
          }
          foreach ($s in $skills) {
            $content = Get-Content $s.FullName -Raw
            if ($content -notmatch '(?m)^name:\s+' -or $content -notmatch '(?m)^description:\s*(.+)$') {
              Write-Error "Invalid frontmatter in $($s.FullName)"
              exit 1
            }
            $rawDesc = $Matches[1].Trim()
            if ($rawDesc -notmatch '^([''"]).*\1$' -and $rawDesc -match ':\s') {
              Write-Error "YAML Syntax Violation in $($s.FullName): Unquoted description contains ': ' sequence. Must be enclosed in quotes."
              exit 1
            }
            $desc = $rawDesc.Trim('''', '"').Replace("`r", "")
            if ($desc.Length -gt 128) {
              Write-Error "Frontmatter description in $($s.FullName) exceeds 128 chars ($($desc.Length) chars): $desc"
              exit 1
            }
          }
          Write-Host "[PASS] All $($skills.Count) bespoke skills verified with frontmatter description <= 128 chars."

      - name: Verify ADR Index Integrity
        shell: pwsh
        run: |
          $adrs = Get-ChildItem -Path "docs/adr" -Filter "*.md" | Where-Object { $_.Name -ne "README.md" }
          if ($adrs.Count -lt 20) {
            Write-Error "Expected at least 20 ADRs, found $($adrs.Count)"
            exit 1
          }
          $adrReadme = Get-Content "docs/adr/README.md" -Raw
          foreach ($adr in $adrs) {
            if ($adrReadme -notmatch [regex]::Escape($adr.Name)) {
              Write-Error "ADR $($adr.Name) is not indexed in docs/adr/README.md"
              exit 1
            }
          }
          $indexedMatches = [regex]::Matches($adrReadme, '(?m)\[ADR-\d+\]\(\.\/([^)]+)\)')
          foreach ($m in $indexedMatches) {
            $target = Join-Path "docs/adr" $m.Groups[1].Value
            if (-not (Test-Path $target)) {
              Write-Error "Indexed ADR file does not exist: $target"
              exit 1
            }
          }
          Write-Host "[PASS] All $($adrs.Count) ADRs indexed and verified (two-way validation)."

      - name: Run Secret / Credential Leak Scanner
        shell: pwsh
        run: |
          $secretPatterns = @(
            'Bearer\s+(?!<)[A-Za-z0-9_\-\.]{12,}',
            '["'']?(?:api[_-]?key|access[_-]?token|secret[_-]?key|token)["'']?\s*[:=]\s*["''](?!<)[^\s"'']{16,}["'']',
            '(?m)^\s*(?:[A-Za-z0-9_]*_)?(?:api[_-]?key|access[_-]?token|secret[_-]?key)\s*[:=]\s*(?!<)[A-Za-z0-9_\-\.]{20,}\s*$',
            '\b(ghp|github_pat|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{20,}',
            '-----BEGIN\s+([A-Z0-9_-]+\s+)?PRIVATE\s+KEY-----',
            '\b(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|AIza[0-9A-Za-z\-_]{35}|sk-ant-(?:api|admin)\d{2}-[a-zA-Z0-9_-]{30,}|sk-(?:proj|svcacct|admin)-[a-zA-Z0-9_-]{30,}|sk-[a-zA-Z0-9]{20,})\b',
            '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
          )
          $binaryExtensions = @('.png', '.jpg', '.jpeg', '.gif', '.ico', '.webp', '.woff', '.woff2', '.ttf', '.otf', '.zip', '.pdf')
          $files = Get-ChildItem -Path "README.md", "TOOLKIT.md", "sync.ps1", "restore.ps1", "config", "docs", ".github" -Recurse -File -Force | Where-Object { $_.Extension.ToLowerInvariant() -notin $binaryExtensions }
          foreach ($f in $files) {
            $content = Get-Content -LiteralPath $f.FullName
            foreach ($line in $content) {
              foreach ($p in $secretPatterns) {
                if ($line -match $p) {
                  Write-Error "Credential leak detected in $($f.FullName): $line"
                  exit 1
                }
              }
            }
          }
          Write-Host "[PASS] Zero unmasked credentials found across all tracked files."
