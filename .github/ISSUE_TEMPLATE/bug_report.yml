name: Bug Report
description: Report a broken script, false-positive AST block, or unexpected behavior.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Please provide the details below so we can reproduce and address it.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug or unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps or exact command line to reproduce the issue.
      placeholder: |
        1. Run command '...'
        2. In environment '...'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Operating System / Shell
      description: Which environment did this occur on?
      options:
        - Windows (PowerShell 7.x / pwsh)
        - Windows (Windows PowerShell 5.1)
        - Linux / macOS (PowerShell 7.x)
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Bug Checklist
      options:
        - label: I verified this issue is not already reported in existing issues.
          required: true
        - label: I ensured no private credentials, tokens, or personal paths are included.
          required: true
